<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Model Rambut AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
    background: #f5f6f8;
    color: #222;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 24px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }

  /* Grid model rambut */
  #styleList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    max-height: 500px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .style-opt {
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    background: #fff;
  }
  .style-opt:hover { border-color: #bbb; }
  .style-opt.selected { border-color: #2563eb; background: #eff6ff; }
  .style-opt img {
    width: 100%;
    height: 100px;
    object-fit: cover;
    border-radius: 6px;
    background: #eee;
    display: block;
  }
  .style-opt .name {
    font-weight: 600;
    font-size: 13px;
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .style-opt .cat {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #ddd;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: #999; }
  .filter-btn.active {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }

  #preview { max-width: 180px; border-radius: 10px; margin-top: 12px; display: none; }
  button.primary {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button.primary:disabled { background: #93b4f5; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: 14px; color: #555; text-align: center; }
  .hidden { display: none; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; word-break: break-all; white-space: pre-wrap; }
  .loading { color: #888; font-size: 14px; padding: 20px; text-align: center; }

  /* ==== BEFORE/AFTER SLIDER ==== */
  .ba-wrap {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 16px auto 0;
    border-radius: 12px;
    overflow: hidden;
    background: #eee;
    aspect-ratio: 1 / 1;
    user-select: none;
    touch-action: none;
  }
  .ba-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .ba-after {
    clip-path: inset(0 0 0 50%);
    transition: clip-path 0.1s linear;
  }
  .ba-wrap.animating .ba-after {
    transition: clip-path 3s ease-in-out;
  }
  .ba-divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #fff;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .ba-handle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #333;
    pointer-events: auto;
  }
  .ba-handle:active { cursor: grabbing; }
  .ba-label {
    position: absolute;
    top: 12px;
    padding: 4px 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }
  .ba-label.before { left: 12px; }
  .ba-label.after { right: 12px; }
  .ba-caption {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
  }
  .ba-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .ba-actions button {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    width: auto;
  }
  .ba-actions button:hover { border-color: #999; }
</style>
</head>
<body>

<h1>💇 Simulasi Model Rambut AI</h1>
<p class="sub">Pilih gaya, upload selfie, lihat perbandingan sebelum &amp; sesudah.</p>

<!-- PILIH GAYA -->
<div class="card">
  <label>1. Pilih Model Rambut</label>
  <div class="filter-bar" id="filterBar"></div>
  <div class="loading" id="loadingStyles">Memuat model rambut...</div>
  <div id="styleList"></div>
</div>

<!-- UPLOAD -->
<div class="card">
  <label>2. Upload Foto Selfie</label>
  <input type="file" id="photoInput" accept="image/*">
  <img id="preview" alt="preview">
</div>

<!-- TOMBOL -->
<div class="card">
  <button class="primary" id="simBtn" disabled>3. Simulasikan</button>
  <div id="status"></div>
  <div id="errorBox" class="err"></div>
</div>

<!-- HASIL -->
<div class="card hidden" id="resultCard">
  <label>Hasil Simulasi</label>

  <!-- Before/After Slider -->
  <div class="ba-wrap" id="baWrap">
    <img id="imgBefore" class="ba-before" alt="Sebelum">
    <img id="imgAfter" class="ba-after" alt="Sesudah">
    <div class="ba-label before">SEBELUM</div>
    <div class="ba-label after">SESUDAH</div>
    <div class="ba-divider" id="baDivider"></div>
    <div class="ba-handle" id="baHandle">⇔</div>
  </div>

  <div class="ba-actions">
    <button id="btnPlay">▶ Putar Animasi</button>
    <button id="btnBefore">◀ Sebelum</button>
    <button id="btnAfter">Sesudah ▶</button>
  </div>

  <p class="ba-caption">Geser handle untuk membandingkan sebelum &amp; sesudah.</p>
</div>

<script>
// ==== KONFIGURASI ====
const HAIRSTYLES_URL = '/.netlify/functions/get_hairstyles';
const GENERATE_URL = '/.netlify/functions/sensenova_proxy';

const MAX_INPUT_SIZE = 768;        // turun agar tidak timeout
const JPEG_QUALITY = 0.85;
const OUTPUT_SIZE = '2048x2048';   // aman di bawah 60s

// ==== STATE ====
let allHairstyles = [];
let activeCategory = 'Semua';
let selectedStyle = null;
let photoBase64 = null;
let beforeImage = null;   // data URL selfie asli
let afterImage = null;    // data URL hasil AI

// ==== LOAD MODEL RAMBUT ====
async function loadHairstyles() {
  const loading = document.getElementById('loadingStyles');
  const list = document.getElementById('styleList');

  try {
    const res = await fetch(HAIRSTYLES_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    allHairstyles = await res.json();
    loading.style.display = 'none';

    if (!Array.isArray(allHairstyles) || allHairstyles.length === 0) {
      loading.textContent = 'Tidak ada model rambut di database.';
      loading.style.display = 'block';
      return;
    }

    const categories = ['Semua', ...new Set(allHairstyles.map(h => h.kategori).filter(Boolean))];
    const filterBar = document.getElementById('filterBar');
    filterBar.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (cat === 'Semua' ? ' active' : '');
      btn.textContent = cat;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = cat;
        renderHairstyles();
      });
      filterBar.appendChild(btn);
    });

    renderHairstyles();
  } catch (err) {
    loading.textContent = 'Gagal memuat model rambut: ' + err.message;
    console.error(err);
  }
}

function renderHairstyles() {
  const list = document.getElementById('styleList');
  list.innerHTML = '';

  const filtered = activeCategory === 'Semua'
    ? allHairstyles
    : allHairstyles.filter(h => h.kategori === activeCategory);

  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'style-opt';
    div.dataset.id = item.nomor;
    div.innerHTML = `
      <img src="${item.link_url_bucket}" alt="${item.nama_model_rambut}" loading="lazy"
           onerror="this.style.background='#ddd'">
      <div class="name" title="${item.nama_model_rambut}">${item.nama_model_rambut}</div>
      <div class="cat">${item.kategori || ''}</div>
    `;
    div.addEventListener('click', () => {
      document.querySelectorAll('.style-opt').forEach(x => x.classList.remove('selected'));
      div.classList.add('selected');
      selectedStyle = item;
      checkReady();
    });
    list.appendChild(div);
  });
}

// ==== UPLOAD + PERKECIL GAMBAR ====
document.getElementById('photoInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth;
    let h = img.naturalHeight;

    if (w > MAX_INPUT_SIZE || h > MAX_INPUT_SIZE) {
      const r = Math.min(MAX_INPUT_SIZE / w, MAX_INPUT_SIZE / h);
      w = Math.round(w * r);
      h = Math.round(h * r);
    }

    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

    photoBase64 = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
    beforeImage = photoBase64;   // simpan untuk slider "sebelum"

    const prev = document.getElementById('preview');
    prev.src = photoBase64;
    prev.style.display = 'block';

    checkReady();
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => alert('Gagal membaca file gambar.');
  img.src = URL.createObjectURL(file);
});

function checkReady() {
  document.getElementById('simBtn').disabled = !(selectedStyle && photoBase64);
}

// ==== GENERATE 1 SUDUT SAJA (tampak depan) ====
async function generateOne() {
  const prompt =
    `Take the person in the FIRST image and apply the hairstyle shown in the SECOND image. ` +
    `Hairstyle name: ${selectedStyle.nama_model_rambut}. ` +
    `Description: ${selectedStyle.informasi || ''}. ` +
    `Keep the person's face, facial features, skin tone, and identity exactly the same. ` +
    `Front view, facing the camera directly. ` +
    `Realistic photograph, natural lighting, same background as the original.`;

  const res = await fetch(GENERATE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'sensenova-u1.5-lite',
      prompt: prompt,
      images: [
        { image_url: photoBase64 },
        { image_url: selectedStyle.link_url_bucket }
      ],
      size: OUTPUT_SIZE,
      watermark: false,
      output_format: 'jpeg',
      response_format: 'b64_json',
      prompt_extend: false,
      n: 1
    })
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt}`);
  }

  const data = await res.json();
  const item = data.data?.[0];
  if (!item) throw new Error('Response tidak berisi gambar.');
  if (item.b64_json) return 'data:image/jpeg;base64,' + item.b64_json;
  if (item.url) return item.url;
  throw new Error('Format response tidak dikenali.');
}

// ==== BEFORE/AFTER SLIDER ====
const baWrap = document.getElementById('baWrap');
const imgBefore = document.getElementById('imgBefore');
const imgAfter = document.getElementById('imgAfter');
const baDivider = document.getElementById('baDivider');
const baHandle = document.getElementById('baHandle');

let sliderPos = 50;         // persen (0 = full after, 100 = full before)
let isDragging = false;

function setSlider(pct) {
  sliderPos = Math.max(0, Math.min(100, pct));
  // imgAfter di-clip: tampilkan bagian kanan (after) sebesar (100 - sliderPos)
  // Slider di kiri → after terlihat dari kiri ke kanan
  // Kita pakai clip-path inset(0 0 0 X%) → after tampil mulai dari X% ke kanan
  imgAfter.style.clipPath = `inset(0 0 0 ${sliderPos}%)`;
  baDivider.style.left = sliderPos + '%';
  baHandle.style.left = sliderPos + '%';
}

// Init posisi tengah
setSlider(50);

// Drag dengan mouse
baWrap.addEventListener('mousedown', e => {
  isDragging = true;
  baWrap.classList.remove('animating');
  updateFromEvent(e);
});
window.addEventListener('mousemove', e => {
  if (isDragging) updateFromEvent(e);
});
window.addEventListener('mouseup', () => { isDragging = false; });

// Drag dengan sentuhan
baWrap.addEventListener('touchstart', e => {
  isDragging = true;
  baWrap.classList.remove('animating');
  updateFromEvent(e.touches[0]);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (isDragging) updateFromEvent(e.touches[0]);
}, { passive: true });
window.addEventListener('touchend', () => { isDragging = false; });

function updateFromEvent(e) {
  const rect = baWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const pct = (x / rect.width) * 100;
  setSlider(pct);
}

// Tombol kontrol
document.getElementById('btnBefore').addEventListener('click', () => {
  baWrap.classList.add('animating');
  setSlider(0);   // full "sebelum"
});
document.getElementById('btnAfter').addEventListener('click', () => {
  baWrap.classList.add('animating');
  setSlider(100); // full "sesudah"
});
document.getElementById('btnPlay').addEventListener('click', () => {
  baWrap.classList.add('animating');
  // Animasi: mulai dari before, geser ke after
  setSlider(0);
  setTimeout(() => setSlider(100), 50);
});

// ==== TOMBOL SIMULASI ====
document.getElementById('simBtn').addEventListener('click', async () => {
  const btn = document.getElementById('simBtn');
  const status = document.getElementById('status');
  const errBox = document.getElementById('errorBox');
  errBox.textContent = '';

  btn.disabled = true;
  document.getElementById('resultCard').classList.remove('hidden');
  status.textContent = 'Menghasilkan gambar...';

  try {
    const url = await generateOne();
    afterImage = url;

    imgBefore.src = beforeImage;
    imgAfter.src = afterImage;

    // Setelah gambar load, jalankan animasi otomatis
    imgAfter.onload = () => {
      baWrap.classList.add('animating');
      setSlider(0);
      setTimeout(() => setSlider(100), 100);
    };

    status.textContent = 'Selesai.';
  } catch (err) {
    console.error(err);
    errBox.textContent = err.message;
    status.textContent = 'Gagal.';
  }

  btn.disabled = false;
});

// ==== INISIALISASI ====
loadHairstyles();
</script>
</body>
</html>
